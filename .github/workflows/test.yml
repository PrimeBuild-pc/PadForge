name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the mapping core
        run: dotnet test tests/PadForge.Core.Tests/PadForge.Core.Tests.csproj -c Release
      - name: Build the app and the smoke tool
        run: |
          dotnet build src/PadForge/PadForge.csproj -c Release
          dotnet build tools/PadForge.Smoke/PadForge.Smoke.csproj -c Release

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Test the mapping core
        shell: pwsh
        run: |
          dotnet test tests/PadForge.Core.Tests/PadForge.Core.Tests.csproj -c Release --logger 'trx;LogFileName=padforge.trx' --results-directory $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Mapping tests failed.' }
          [xml]$report = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'padforge.trx')
          $counters = $report.TestRun.ResultSummary.Counters
          if ([int]$counters.executed -le 0 -or [int]$counters.executed -ne [int]$counters.total) {
            throw 'The complete mapping test suite must execute.'
          }
      - name: Build the app and the smoke tool
        shell: pwsh
        run: |
          dotnet build src/PadForge/PadForge.csproj -c Release
          if ($LASTEXITCODE) { throw 'PadForge build failed.' }
          dotnet build tools/PadForge.Smoke/PadForge.Smoke.csproj -c Release
          if ($LASTEXITCODE) { throw 'Smoke tool build failed.' }
      - name: Record the tested PR merge commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: Set-Content -LiteralPath "${env:RUNNER_TEMP}/tested-merge.txt" -Value $env:GITHUB_SHA
      - name: Upload the tested PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: padforge-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-merge.txt
          if-no-files-found: error
          retention-days: 7

name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the mapping core
        run: dotnet test tests/PadForge.Core.Tests/PadForge.Core.Tests.csproj -c Release

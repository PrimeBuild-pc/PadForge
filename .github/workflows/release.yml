name: Package release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version matching the project, such as 0.2.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: padforge-package-${{ github.sha }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'PrimeBuild-pc/PadForge' && github.ref == 'refs/heads/main' && github.actor_id == '162145141'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Validate source and version
        shell: pwsh
        run: |
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -or $headCommit -cne $env:GITHUB_SHA) { throw 'Wrong build source.' }
          if ($env:VERSION -cnotmatch '\A(?<base>(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){2})-beta\.(?:0|[1-9][0-9]*)\z') {
            throw 'Expected a beta version such as 0.2.0-beta.1.'
          }
          $baseVersion = $Matches.base
          $projectVersion = dotnet msbuild src/PadForge/PadForge.csproj -getProperty:Version --nologo
          if ($LASTEXITCODE -or "$projectVersion".Trim() -cne $baseVersion) { throw 'Version does not match the project.' }
      - name: Test the mapping core
        run: dotnet test tests/PadForge.Core.Tests/PadForge.Core.Tests.csproj -c Release
      - name: Publish and verify the portable ZIP
        shell: pwsh
        run: |
          dotnet publish src/PadForge/PadForge.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 "-p:Version=$env:VERSION" -p:IncludeSourceRevisionInInformationalVersion=false -o out/PadForge
          if ($LASTEXITCODE) { throw 'PadForge publish failed.' }
          $archive = "PadForge-$env:VERSION-win-x64.zip"
          'This beta is unsigned. Verify the SHA-256 checksum before running PadForge.' |
            Set-Content -LiteralPath out/PadForge/UNSIGNED-PREVIEW.txt
          Compress-Archive -Path out/PadForge/* -DestinationPath "out/$archive"
          $extracted = Join-Path $env:RUNNER_TEMP 'padforge-package'
          Expand-Archive -LiteralPath "out/$archive" -DestinationPath $extracted
          foreach ($file in 'PadForge.exe', 'PadForge.dll', 'PadForge.Core.dll', 'PadForge.runtimeconfig.json', 'UNSIGNED-PREVIEW.txt') {
            $original = Get-FileHash -LiteralPath "out/PadForge/$file" -Algorithm SHA256
            $packaged = Get-FileHash -LiteralPath (Join-Path $extracted $file) -Algorithm SHA256
            if ($original.Hash -cne $packaged.Hash) { throw "ZIP entry mismatch: $file" }
          }
          $exe = Get-Item -LiteralPath (Join-Path $extracted 'PadForge.exe')
          if ($exe.VersionInfo.ProductVersion -cne $env:VERSION) { throw 'Packaged executable has the wrong version.' }
          $hash = (Get-FileHash -LiteralPath "out/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "out/$archive.sha256" -Encoding ascii
          @(
            '### Unsigned beta candidate'
            ''
            "- Version: $env:VERSION"
            "- Source: $env:GITHUB_SHA"
            "- SHA-256: $hash"
            '- Verified: final ZIP contents. Running the app and virtual driver requires the Windows test environment.'
          ) >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PadForge-${{ inputs.version }}-win-x64
          path: |
            out/PadForge-${{ inputs.version }}-win-x64.zip
            out/PadForge-${{ inputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
